# Currencies (OANDA v20). Anything here can be overridden from .env as FX_<KEY>,
# e.g. FX_MODE=demo, FX_SYMBOLS=EUR_USD,USD_JPY, FX_TIMEFRAME=4h
# Market data needs an OANDA token even in signal mode: the first user with
# USER<n>_FX_OANDA_TOKEN / _ACCOUNT is used (or FX_OANDA_TOKEN / FX_OANDA_ACCOUNT).

label: "💱 Валют"
currency: AUD           # the OANDA account's currency
mode: signal            # signal (paper, real prices) | demo (OANDA practice account) | live
symbols:                # the 5 most traded pairs + 5 more so there are enough trades to judge
  - EUR_USD
  - USD_JPY
  - GBP_USD
  - AUD_USD
  - USD_CAD
  - USD_CHF
  - NZD_USD
  - EUR_JPY
  - GBP_JPY
  - EUR_GBP
timeframe: 4h           # chosen by tools/tf_compare.py (1h vs 4h on 8 years)
history_days: 2920      # 8 years
book_days: 730          # OANDA crowd history to download (older years: no crowd data)
book_every_hours: 6
paper_start_equity: 10000
entry_order: maker      # limit entry (FX has no maker rebate; the spread is the cost)

# Higher timeframes the score looks at, per base timeframe: [pandas rule, EMA length]
htf:
  1h: [[4h, 50], [1D, 20]]
  4h: [[1D, 20], [1W, 10]]

# Prices other sources read (not traded): oil, gold, copper, S&P 500, and US 2y /
# German 10y / UK 10y government bonds for daily yield moves
aux_symbols: [BCO_USD, XAU_USD, XCU_USD, SPX500_USD, USB02Y_USD, DE10YB_EUR, UK10YB_GBP]

costs:                  # fractions of price, per side: about half the typical spread (crosses are wider)
  maker: 0.00006
  taker: 0.00008
  slippage: 0.00003

risk:                   # FX moves ~0.1%/hour, so crypto's 0.3% minimum stop would refuse everything
  min_stop_distance: 0.0008   # 0.08%
  max_stop_distance: 0.03
  max_leverage: 3             # owner's choice (2026-10-18; was 2)
  max_spread: 0.0004          # no new entry while the live spread is wider than 0.04% of price
  max_currency_risk: 0.02     # open risk leaning one way on one currency (e.g. 3 x "USD falls") <= 2%
  ladder:                     # risk per trade steps with the last 30 closed trades
    levels: [0.005, 0.01]     # start at 0.5%, never above 1%
    window: 30
    up_avg_r: 0.0             # move up: average R above this ...
    up_profit_factor: 1.2     # ... and profit factor above this
    down_avg_r: 0.0           # move down: average R below this

validation:             # "too few trades proves nothing": stricter than crypto
  min_fold_trades: 40
  min_vault_trades: 60
  portfolio: true         # the shared-account vault (core/portfolio.py) must also be profitable
  max_p_value: 0.20       # and the edge must beat 80% of random-entry runs (core/significance.py; owner's choice 2026-10-18, was 90%)
  random_runs: 100

# No new entries (backtest and live): the daily rollover, when spreads widen a lot,
# and Friday evening before the weekend gap.
no_entry:
  rollover_utc: [20.5, 22.5]
  friday_after_utc: 18

# Calendar blackout: high-impact events of the pair's own two currencies
event_countries: [USD, EUR, JPY, GBP, AUD, CAD, CHF, NZD]
events_by_symbol: true

news_feeds:
  fxstreet: https://www.fxstreet.com/rss/news
  forexlive: https://www.forexlive.com/feed/news
  marketpulse: https://www.marketpulse.com/feed/
  investing_fx: https://www.investing.com/rss/news_1.rss

research_sources:
  r/Forex: https://www.reddit.com/r/Forex/top/.rss?t=week
  r/algotrading: https://www.reddit.com/r/algotrading/top/.rss?t=week
  r/Daytrading: https://www.reddit.com/r/Daytrading/top/.rss?t=week
