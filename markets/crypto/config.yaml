# Crypto market (Binance USDⓈ-M futures). Anything here can be overridden from .env
# as CRYPTO_<KEY>, e.g. CRYPTO_MODE=demo, CRYPTO_SYMBOLS=BTC/USDT:USDT,ETH/USDT:USDT

label: "₿ Крипто"
mode: signal            # signal (paper, no keys) | demo | testnet | live
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - BNB/USDT:USDT
  - XRP/USDT:USDT
  - SOL/USDT:USDT
timeframe: 4h            # owner, 2026-10-19 (look-back test: 1h -9.6% vs 4h about -0.2% per 2 months)
history_days: 730
entry_threshold: 1.5     # owner, 2026-10-26: fixed, the self-improver never changes it
entry_order: maker      # maker = post-only limit (0.02%), market = immediate (0.05%)
paper_start_equity: 1000
review_reference: BTC/USDT:USDT   # trade reviews compare each trade with what BTC did

risk:
  max_risk_per_trade: 0.005   # owner, 2026-10-19: 0.5% on every market

validation:                   # owner, 2026-10-19: FX's strict checks (look-back test: 4h + strict was best)
  min_fold_trades: 40
  min_vault_trades: 60
  portfolio: true
  max_p_value: 0.20
  random_runs: 100

# Higher timeframes the score looks at, per base timeframe: [pandas rule, EMA length]
htf:
  1h: [[4h, 50], [1D, 20]]
  4h: [[1D, 20], [1W, 10]]

costs:                  # fractions of price
  maker: 0.0002
  taker: 0.0005
  slippage: 0.0002

carry:                  # spot long + perp short, market-neutral funding income
  enabled: true
  symbols: [DOGE/USDT:USDT, TRX/USDT:USDT, ADA/USDT:USDT, LINK/USDT:USDT]
  min_apr: 0.15
  exit_apr: 0.03

news_feeds:
  coindesk: https://www.coindesk.com/arc/outboundfeeds/rss/
  cointelegraph: https://cointelegraph.com/rss
  decrypt: https://decrypt.co/feed
  theblock: https://www.theblock.co/rss.xml
  bitcoinmagazine: https://bitcoinmagazine.com/.rss/full/

research_sources:
  r/algotrading: https://www.reddit.com/r/algotrading/top/.rss?t=week
  r/CryptoCurrencyTrading: https://www.reddit.com/r/CryptoCurrencyTrading/top/.rss?t=week
  r/Daytrading: https://www.reddit.com/r/Daytrading/top/.rss?t=week
  r/BitcoinMarkets: https://www.reddit.com/r/BitcoinMarkets/top/.rss?t=week

# News sentiment can't be backtested (no history), so it gets no say in decisions
# for now (owner, 2026-10-19). Headlines are still collected for later.
use_news: false
