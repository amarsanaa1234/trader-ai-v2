# Crypto market (Binance USDⓈ-M futures). Anything here can be overridden from .env
# as CRYPTO_<KEY>, e.g. CRYPTO_MODE=demo, CRYPTO_SYMBOLS=BTC/USDT:USDT,ETH/USDT:USDT

label: "₿ Крипто"
mode: signal            # signal (paper, no keys) | demo | testnet | live
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - BNB/USDT:USDT
  - XRP/USDT:USDT
  - SOL/USDT:USDT
timeframe: 1h
history_days: 730
entry_order: maker      # maker = post-only limit (0.02%), market = immediate (0.05%)
paper_start_equity: 1000

costs:                  # fractions of price
  maker: 0.0002
  taker: 0.0005
  slippage: 0.0002

carry:                  # spot long + perp short, market-neutral funding income
  enabled: true
  symbols: [DOGE/USDT:USDT, TRX/USDT:USDT, ADA/USDT:USDT, LINK/USDT:USDT]
  min_apr: 0.15
  exit_apr: 0.03

news_feeds:
  coindesk: https://www.coindesk.com/arc/outboundfeeds/rss/
  cointelegraph: https://cointelegraph.com/rss
  decrypt: https://decrypt.co/feed
  theblock: https://www.theblock.co/rss.xml
  bitcoinmagazine: https://bitcoinmagazine.com/.rss/full/

research_sources:
  r/algotrading: https://www.reddit.com/r/algotrading/top/.rss?t=week
  r/CryptoCurrencyTrading: https://www.reddit.com/r/CryptoCurrencyTrading/top/.rss?t=week
  r/Daytrading: https://www.reddit.com/r/Daytrading/top/.rss?t=week
  r/BitcoinMarkets: https://www.reddit.com/r/BitcoinMarkets/top/.rss?t=week
